<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tópico 2 | Custeio Variavel e Margem de Contribuicao</title>
    <style>
        :root { --primary: #002060; --secondary: #0080FF; --bg: #F4F7FA; --surface: #FFF; --border: #E2E8F0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 2rem; color: #0F172A; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 900px; width: 100%; margin: auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; min-height: 480px; display: flex; flex-direction: column; justify-content: space-between; }
        .tag { display: inline-block; font-size: 0.75rem; font-weight: 700; color: var(--secondary); background: #E6F2FF; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .title { font-size: 1.6rem; color: var(--primary); margin: 1rem 0; }
        .highlight { background: #E6F2FF; border-left: 4px solid var(--secondary); padding: 1rem; border-radius: 4px; color: var(--primary); font-weight: 500; }
        .controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 2rem; }
        .btn { display: inline-block; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 600; text-decoration: none; border-radius: 6px; }
        .btn-nav { background: var(--primary); color: #FFF; }
        .btn-out { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div>
                <span class="tag">Tópico 2 de 10</span>
                <h1 class="title">Tópico 2: Módulo Estrutural</h1>
                <p style="color:#475569; margin-bottom:1rem;">Estrutura pronta para recepção dos slides e formulações parametrizadas da disciplina.</p>
                <div class="highlight">Gestão de Custos • Prof. Msc. Philipe Sampaio Lima • CEST Anil</div>
            </div>
            <div class="controls">
                <a href="1.html" class="btn btn-out">&larr; Anterior</a>
                <span style="font-weight:700; color:var(--primary);">Slide 1 / 10</span>
                <a href="3.html" class="btn btn-nav">Próximo &rarr;</a>
            </div>
        </div>
    </div>
</body>
</html>
